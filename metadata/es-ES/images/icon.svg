<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <filter id="card-shadow" x="-15%" y="-15%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#0f172a" flood-opacity="0.32"/>
    </filter>
    <filter id="drop-shadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.22"/>
    </filter>
    
  </defs>
  
  <!-- Transparent canvas with rounded squircle badge (Ideal for F-Droid web and client) -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#bg-grad)" filter="url(#card-shadow)"/>
  
  <!-- App Symbol -->
  
        <!-- Viewfinder brackets -->
        <path d="M 140 180 L 140 156 A 16 16 0 0 1 156 140 L 180 140" fill="none" stroke="#FFFFFF" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M 332 140 L 356 140 A 16 16 0 0 1 372 156 L 372 180" fill="none" stroke="#FFFFFF" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M 140 332 L 140 356 A 16 16 0 0 0 156 372 L 180 372" fill="none" stroke="#FFFFFF" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M 372 332 L 372 356 A 16 16 0 0 1 356 372 L 332 372" fill="none" stroke="#FFFFFF" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
        
        <!-- QR Finder Patterns: Top-Left -->
        <rect x="180" y="180" width="64" height="64" rx="14" fill="none" stroke="#FFFFFF" stroke-width="14"/>
        <rect x="200" y="200" width="24" height="24" rx="6" fill="#FFFFFF"/>
        
        <!-- QR Finder Patterns: Top-Right -->
        <rect x="268" y="180" width="64" height="64" rx="14" fill="none" stroke="#FFFFFF" stroke-width="14"/>
        <rect x="288" y="200" width="24" height="24" rx="6" fill="#FFFFFF"/>
        
        <!-- QR Finder Patterns: Bottom-Left -->
        <rect x="180" y="268" width="64" height="64" rx="14" fill="none" stroke="#FFFFFF" stroke-width="14"/>
        <rect x="200" y="288" width="24" height="24" rx="6" fill="#FFFFFF"/>
        
        <!-- QR Alignment/Data Dots -->
        <rect x="268" y="268" width="24" height="24" rx="6" fill="#FFFFFF"/>
        <rect x="308" y="268" width="24" height="24" rx="6" fill="#38bdf8"/>
        <rect x="268" y="308" width="24" height="24" rx="6" fill="#FFFFFF"/>
        <rect x="308" y="308" width="24" height="24" rx="6" fill="#FFFFFF"/>
        
        <!-- Subtle Scan Laser Accent -->
        <line x1="150" y1="256" x2="362" y2="256" stroke="#bae6fd" stroke-width="6" stroke-linecap="round" stroke-dasharray="16 8"/>
        
</svg>